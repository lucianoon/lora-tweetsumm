version: 2

updates:
  # Stack de ML do projeto (pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # O README publica uma tabela de ablação com números ROUGE exatos, medidos
      # nesta stack. Subir torch ou peft por PR automático invalida em silêncio
      # os resultados publicados — e em 0.x/torch o minor já quebra API.
      - dependency-name: "torch"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "peft"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # transformers 4→5 e datasets 2→3 são migrações de API.
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "datasets"
        update-types: ["version-update:semver-major"]
      - dependency-name: "accelerate"
        update-types: ["version-update:semver-major"]
    groups:
      python-dependencies:
        patterns: ["*"]

  # O Space tem requirements próprio e precisa casar com a stack acima, senão
  # a demo hospedada roda contra versões diferentes do treino.
  - package-ecosystem: "pip"
    directory: "/space"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "torch"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "peft"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
    groups:
      space-dependencies:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # A imagem base acompanha o requires-python; trocar de série é decisão,
      # não atualização.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      containers:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
